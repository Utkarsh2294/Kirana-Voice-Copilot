server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /healthz { access_log off; return 200 'ok'; }
  location /api/ { proxy_pass http://server:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 35s; }
  location /ws/voice { proxy_pass http://server:3001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 50s; }
  location /voice-assets/ { types { application/wasm wasm; application/javascript js mjs; application/octet-stream onnx; } try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
