name: kirana
services:
  mongo:
    image: mongo:7.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval ''try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}] }).ok }'' | grep 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    profiles: ['cache']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
  server:
    build: { context: '..', dockerfile: 'infra/server.Dockerfile' }
    env_file: ../apps/server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/kirana?replicaSet=rs0
      RECO_URL: http://reco:8000
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      mongo: { condition: service_healthy }
      reco: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
  reco:
    build: { context: '..', dockerfile: 'services/reco/Dockerfile' }
    env_file: ../services/reco/.env
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  client:
    build: { context: '..', dockerfile: 'infra/client.Dockerfile' }
    ports: ['127.0.0.1:5173:80']
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mongo-data:
