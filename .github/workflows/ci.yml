name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-client-build.js
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: apps/client/dist
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/reco/requirements*.txt
      - run: pip install -r services/reco/requirements-dev.txt
      - run: python -m ruff check services/reco
      - run: python -m pytest services/reco/tests
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp apps/server/.env.example apps/server/.env
      - run: cp services/reco/.env.example services/reco/.env
      - run: docker compose -f infra/docker-compose.yml up --build --wait --wait-timeout 180
      - run: curl --fail http://localhost:3001/healthz && curl --fail http://localhost:3001/readyz && curl --fail http://localhost:8000/readyz && curl --fail http://localhost:5173/bill
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.yml down
  deploy-client:
    needs: [javascript, python, compose]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - env:
          DEPLOY_HOOK: ${{ secrets.CLIENT_DEPLOY_HOOK }}
        run: test -n "$DEPLOY_HOOK" && curl --fail --max-time 30 -X POST "$DEPLOY_HOOK"
  deploy-services:
    needs: [javascript, python, compose]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - env:
          SERVER_HOOK: ${{ secrets.SERVER_DEPLOY_HOOK }}
          RECO_HOOK: ${{ secrets.RECO_DEPLOY_HOOK }}
        run: test -n "$SERVER_HOOK" && test -n "$RECO_HOOK" && curl --fail --max-time 30 -X POST "$SERVER_HOOK" && curl --fail --max-time 30 -X POST "$RECO_HOOK"
